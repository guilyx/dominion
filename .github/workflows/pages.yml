name: Pages

# Publishes the project site, with the game itself playable at /play/.
# The site is hand-written HTML in site/; the game is the same single-file build
# that ships on the releases page, so the page you play is the artifact we test.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'index.html'
      - 'style.css'
      - 'vendor/**'
      - 'build.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy half-way; just skip queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Assemble
        run: |
          mkdir -p _site/play
          cp -r site/. _site/
          node build.js --out _site/play/index.html
          # The app icon doubles as the site favicon.
          cp build-assets/icon.png _site/img/icon.png
          # Tell Pages not to run the output through Jekyll.
          touch _site/.nojekyll
          find _site -type f | sort
          du -sh _site

      - name: Check every internal link resolves
        run: node tools/check-site-links.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
